name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o SHOFI_RENDER_READY.zip -d extracted
          cp -r extracted/* ./
          rm -rf extracted
          rm -f SHOFI_RENDER_READY.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract SHOFI hosting project" || echo "Nothing to commit"
          git push
